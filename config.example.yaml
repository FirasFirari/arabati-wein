# Sources that are general-interest rather than vehicle-specific. Their posts
# nearly always carry a photo, so images alone would wave every one through to
# a paid call. For these, the TEXT must mention a vehicle as well.
general_sources:
  # both dropped from `channels` above on 2026-08-24 (yield audit). Left listed
  # so the strict rule still applies to the 3,683 posts already collected from
  # them, and so re-enabling either channel restores the correct behaviour.
  - "telegram:sudaaan"
  - "telegram:sudanbid"

matching:
  # Posts scoring at or above this (0-100) trigger an instant alert.
  alert_threshold: 70
  # Posts scoring below this are stored but marked not-a-candidate.
  candidate_threshold: 40
  # Attach the owner's reference photos and ask for a visual comparison.
  # OFF by decision (2026-08-23): a white 2013-2016 Corolla looks like every
  # other one, and chassis/engine transplant is the standard laundering
  # method here — the car will be found by an IDENTIFIER, whether written in
  # the post text or legible in a photo, not by resemblance. Turning this off
  # also stops paying to send the reference photo on every deep call.
  use_reference_photos: false

car:
  make: Toyota
  model: Corolla
  model_code: ""
  year: 2015
  production_date: ""
  color: "White / أبيض"
  vin: "CHANGE_ME_17_CHARACTER_VIN"
  engine: ""
  plate: "12345 / خ1"
  registered_at: "Omdurman"
  made_in: ""
  # THE MOST IMPORTANT SECTION — thieves change plates, not dents.
  # List every unique mark: dents, scratches, stickers, rims, seat covers,
  # tinting, cracks, accessories, anything a stranger's car wouldn't have.
  distinguishing_features:
    - "example: sticker on the rear-right window"

# Netlify project that serves mycarsd.online (scripts/netlify_deploy.py,
# scripts/fetch_watches.py). NETLIFY_SITE_ID in the environment overrides.
netlify:
  site_id: CHANGE_ME

# Outbound notifications for standing-watch leads (carhunt/notify.py).
# Email goes through Resend when a key exists in RESEND_API_KEY or
# site/resend_key.txt; until mycarsd.online is verified there it is a no-op.
notify:
  resend_from: "Arabati Wein <alerts@mycarsd.online>"
